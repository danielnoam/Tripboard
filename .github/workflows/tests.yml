# The test suite on every pull request and push to main: "Tests" is the
# check main requires before a merge. The native and Pages workflows call
# it too, so nothing is built or deployed from a red commit.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ui.test.js skips itself without Playwright; here it must run, so
      # Playwright and its Chromium go in a folder of their own, kept out
      # of the app's package.json (the web app has no dependencies).
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node test/run-all.js
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          REQUIRE_UI: "1"
