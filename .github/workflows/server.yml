# Deploys the sharing server (server/) to Cloudflare. It runs after a merge
# that changes server/ or a file its bundle takes in (the cloud connector
# serves cli/'s tools, which load src/'s model, merge, list import, places,
# weather and keel's github.js), or by hand. It needs, in the repo's settings:
#   secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables TRIPBOARD_D1_ID, TRIPBOARD_KV_ID
# and, for the cloud connector for AI apps (server/mcp.js), optionally:
#   secrets   TRIPBOARD_GITHUB_APP_SECRET, TRIPBOARD_MCP_SECRET
#   variables TRIPBOARD_GITHUB_APP_ID (the app's client ID), TRIPBOARD_MCP_USERS
# (server/README.md says where each comes from). Without them it skips.
name: Sharing server

on:
  push:
    branches: [main]
    paths: ["server/**", "cli/**", "src/model.js", "src/merge.js", "src/listimport.js", "src/places.js", "src/weather.js",
      "src/keel/github.js", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.TRIPBOARD_D1_ID }}
      KV_ID: ${{ vars.TRIPBOARD_KV_ID }}
      APP_ID: ${{ vars.TRIPBOARD_GITHUB_APP_ID }}
      APP_SECRET: ${{ secrets.TRIPBOARD_GITHUB_APP_SECRET }}
      MCP_SECRET: ${{ secrets.TRIPBOARD_MCP_SECRET }}
      MCP_USERS: ${{ vars.TRIPBOARD_MCP_USERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_ID" ] || [ -z "$KV_ID" ]; then
            echo "::notice::Sharing server not set up yet (see server/README.md); skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Fill in the ids
        if: steps.ready.outputs.go == 'yes'
        working-directory: server
        run: sed -i "s/TRIPBOARD_D1_ID/$D1_ID/; s/TRIPBOARD_KV_ID/$KV_ID/" wrangler.toml
      - name: Database changes
        if: steps.ready.outputs.go == 'yes'
        working-directory: server
        run: npx --yes wrangler@4 d1 migrations apply tripboard --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'yes'
        working-directory: server
        run: npx --yes wrangler@4 deploy
      # The cloud connector turns on only when all four are set; its secrets
      # go to Cloudflare's own secret store, never into wrangler.toml.
      - name: Cloud connector settings
        if: steps.ready.outputs.go == 'yes' && env.APP_ID != '' && env.APP_SECRET != '' && env.MCP_SECRET != '' && env.MCP_USERS != ''
        working-directory: server
        run: |
          printf '%s' "$APP_ID" | npx --yes wrangler@4 secret put GITHUB_APP_CLIENT_ID
          printf '%s' "$APP_SECRET" | npx --yes wrangler@4 secret put GITHUB_APP_CLIENT_SECRET
          printf '%s' "$MCP_SECRET" | npx --yes wrangler@4 secret put MCP_SECRET
          printf '%s' "$MCP_USERS" | npx --yes wrangler@4 secret put MCP_USERS
