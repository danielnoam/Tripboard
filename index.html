<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F5F2">
  <title>Tripboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="src/keel/errlog.js?v=0.1.0" data-key="tripboard.log" data-keep="50" data-console></script>
  <link rel="stylesheet" href="src/styles.css?v=0.1.0">
</head>
<body>
  <header class="bar">
    <button class="icon-btn" id="back" type="button" aria-label="All trips" hidden></button>
    <h1 class="bar-title" id="title">Tripboard</h1>
    <button class="icon-btn" id="editTrip" type="button" aria-label="Edit trip" hidden></button>
  </header>
  <p id="update" class="update" hidden></p>
  <main id="app" tabindex="-1"></main>
  <button class="fab" id="fab" type="button" aria-label="Add a place" hidden></button>

  <dialog class="sheet" id="tripSheet" aria-labelledby="tripSheetTitle">
    <form class="sheet-body" id="tripForm" novalidate>
      <h2 id="tripSheetTitle">New trip</h2>
      <label class="field">Name
        <input name="name" type="text" autocomplete="off" maxlength="120" placeholder="Japan in autumn" required>
      </label>
      <div class="row">
        <label class="field">From <input name="start" type="date"></label>
        <label class="field">To <input name="end" type="date"></label>
      </div>
      <label class="field">Destinations
        <input name="destinations" type="text" autocomplete="off" placeholder="Tokyo, Kyoto, Osaka">
        <span class="hint">Separate them with commas.</span>
      </label>
      <div class="field">
        <span>Cover</span>
        <div class="cover-pick">
          <div class="cover-preview" id="coverPreview"></div>
          <div class="cover-actions">
            <label class="btn">Choose a photo<input id="coverFile" type="file" accept="image/*" class="visually-hidden"></label>
            <button class="btn quiet" id="coverRemove" type="button" hidden>Remove</button>
          </div>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn danger" id="tripDelete" type="button" hidden>Delete trip</button>
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close>Cancel</button>
        <button class="btn primary" type="submit" id="tripSave">Create trip</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="placeSheet" aria-labelledby="placeSheetTitle">
    <form class="sheet-body" id="placeForm" novalidate>
      <h2 id="placeSheetTitle">Add a place</h2>
      <label class="field">Name
        <input name="name" type="text" autocomplete="off" maxlength="160" placeholder="Fushimi Inari" required>
      </label>
      <fieldset class="field">
        <legend>Importance</legend>
        <div class="seg" id="importanceSeg" role="radiogroup"></div>
      </fieldset>
      <label class="field">Category
        <select name="category" id="categorySelect"></select>
      </label>
      <label class="field">Day <select name="daySelect" id="daySelect"></select><input name="dayInput" id="dayInput" type="date" hidden></label>
      <div class="row">
        <label class="field">From <input name="time" type="time"></label>
        <label class="field">To <input name="endTime" type="time"></label>
      </div>
      <label class="field">Description
        <textarea name="note" rows="3" maxlength="2000" placeholder="Go early, before the crowds."></textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn danger" id="placeDelete" type="button" hidden>Delete</button>
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close>Cancel</button>
        <button class="btn primary" type="submit" id="placeSave">Add place</button>
      </div>
    </form>
  </dialog>

  <script src="src/keel/platform.js?v=0.1.0"></script>
  <script src="src/keel/releases.js?v=0.1.0"></script>
  <script src="src/keel/motion.js?v=0.1.0"></script>
  <script src="src/model.js?v=0.1.0"></script>
  <script src="src/store.js?v=0.1.0"></script>
  <script src="src/icons.js?v=0.1.0"></script>
  <script src="src/views.js?v=0.1.0"></script>
  <script src="src/app.js?v=0.1.0"></script>
</body>
</html>
