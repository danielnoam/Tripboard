<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.github.com https://danielnoam.github.io https://tiles.openfreemap.org https://nominatim.openstreetmap.org https://places.googleapis.com https://tile.googleapis.com https://api.maptiler.com https://www.googleapis.com https://oauth2.googleapis.com https://api.open-meteo.com https://tripboard.danielnoam1999.workers.dev; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- The app's home (keel releases.js). Change both before a move to an organization or a custom domain, and ship a release. -->
  <meta name="keel-site" content="https://danielnoam.github.io/Tripboard/">
  <meta name="keel-repo" content="danielnoam/Tripboard">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F5F2">
  <title>Tripboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="src/keel/errlog.js?v=0.3.5" data-key="tripboard.log" data-keep="50" data-console></script>
  <script src="src/keel/i18n.js?v=0.3.5"></script>
  <script src="src/language.js?v=0.3.5"></script>
  <script src="src/theme.js?v=0.3.5"></script>
  <link rel="stylesheet" href="src/styles.css?v=0.3.5">
</head>
<body>
  <header class="bar">
    <button class="icon-btn" id="back" type="button" aria-label="All trips" hidden data-t-attr="aria-label"></button>
    <h1 class="bar-title" id="title">Tripboard</h1>
    <a class="sync-badge" id="syncBadge" href="#/settings/data" hidden><span class="sync-badge-text" id="syncBadgeText"></span></a>
    <span class="offline-badge" id="offlineBadge" hidden title="Ready offline" data-t-attr="title"><span class="offline-badge-text" data-t>Ready offline</span></span>
    <button class="icon-btn" id="newTrip" type="button" aria-label="New trip" title="New trip" hidden data-t-attr="aria-label,title"></button>
    <button class="icon-btn" id="shareTrip" type="button" aria-label="Sharing" title="Sharing" hidden data-t-attr="aria-label,title"></button>
    <button class="icon-btn" id="editTrip" type="button" aria-label="Edit trip" hidden data-t-attr="aria-label"></button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" data-t-attr="aria-label"></button>
  </header>
  <div id="update" class="update" role="status" hidden>
    <span class="update-text" id="updateText"></span>
    <button class="btn primary update-btn" id="updateBtn" type="button"></button>
    <button class="icon-btn update-close" id="updateClose" type="button" aria-label="Not now" title="Not now" data-t-attr="aria-label,title"></button>
  </div>
  <main id="app" tabindex="-1"></main>
  <section class="map-view" id="mapView" aria-label="Map" hidden data-t-attr="aria-label">
    <div class="map" id="map"></div>
    <div class="map-top">
      <div class="map-days" id="mapDays" role="group" aria-label="Show a day" hidden data-t-attr="aria-label"></div>
      <div class="map-days map-filters" id="mapFilters" role="group" aria-label="Show on the map" hidden data-t-attr="aria-label"></div>
      <p class="map-note" id="mapNote" role="status" hidden></p>
      <button class="map-credit" id="mapCredit" type="button" aria-expanded="false" aria-controls="mapCredits" title="Map credits" hidden data-t-attr="title"><span class="map-credit-chip"><span class="map-credit-text"></span><span class="map-credit-ic" id="mapCreditIc"></span></span></button>
      <p class="map-credits" id="mapCredits" hidden></p>
    </div>
    <div class="map-panel" id="mapPanel" hidden></div>
    <div class="map-tools" id="mapTools" hidden>
      <div class="map-zoom">
        <button class="map-tool" id="mapZoomIn" type="button" aria-label="Zoom in" title="Zoom in" data-t-attr="aria-label,title"></button>
        <button class="map-tool" id="mapZoomOut" type="button" aria-label="Zoom out" title="Zoom out" data-t-attr="aria-label,title"></button>
      </div>
      <button class="map-tool" id="mapStyleBtn" type="button" aria-label="Map style" title="Map style" data-t-attr="aria-label,title"></button>
      <button class="map-tool" id="mapFit" type="button" aria-label="Show all places" title="Show all places" data-t-attr="aria-label,title"></button>
      <button class="map-tool" id="mapLocate" type="button" aria-label="Where am I" title="Where am I" data-t-attr="aria-label,title"></button>
    </div>
  </section>
  <div class="bottombar" id="bottomBar" hidden>
    <nav class="tabbar" id="tripBar" aria-label="Show" data-t-attr="aria-label"></nav>
    <button class="fab" id="fab" type="button" aria-label="Add a place" hidden data-t-attr="aria-label"></button>
  </div>

  <dialog class="sheet page" id="tripSheet" aria-labelledby="tripSheetTitle">
    <form class="sheet-body" id="tripForm" novalidate>
      <div class="page-bar">
        <button class="icon-btn page-back" type="button" data-close aria-label="Back" data-t-attr="aria-label"></button>
        <h2 id="tripSheetTitle" data-t>New trip</h2>
      </div>
      <label class="field"><span data-t>Name</span>
        <input name="name" type="text" autocomplete="off" maxlength="120" placeholder="Japan in autumn" required data-t-attr="placeholder">
      </label>
      <div class="row">
        <label class="field"><span data-t>From</span>  <input name="start" type="date"></label>
        <label class="field"><span data-t>To</span>  <input name="end" type="date"></label>
      </div>
      <label class="field"><span data-t>Destinations</span>
        <input name="destinations" type="text" autocomplete="off" placeholder="Tokyo, Kyoto, Osaka" data-t-attr="placeholder">
        <span class="hint" id="tripDestHint" data-t>Separate them with commas.</span>
      </label>
      <div class="field">
        <span data-t>Cover</span>
        <div class="cover-pick">
          <label class="cover-preview" id="coverPreview"><input id="coverFile" type="file" accept="image/*" class="visually-hidden" aria-label="Choose a photo" data-t-attr="aria-label"><span class="cover-show" id="coverShow"></span></label>
          <button class="icon-btn cover-remove" id="coverRemove" type="button" hidden aria-label="Remove the cover" title="Remove the cover" data-t-attr="aria-label,title"></button>
        </div>
        <div class="art-row" id="coverArt" role="group" aria-label="Ready-made covers" data-t-attr="aria-label">
          <label class="art-photo" for="coverFile" id="coverPhotoTile" title="Choose a photo" data-t-attr="title"></label>
        </div>
      </div>
      <div class="field" id="tripImportRow">
        <span id="tripImportLabel" data-t>Start with places</span>
        <div class="offline-card" id="tripListCard" hidden>
          <p class="offline-title" id="tripListCount"></p>
          <p class="dim" id="tripListHow"></p>
          <div class="offline-actions"><button class="btn quiet" id="tripListRemove" type="button" data-t>Remove</button></div>
        </div>
        <div class="import-pick" id="tripImportPick">
          <label class="import-btn" id="tripFromFile"><input id="tripImportFile" type="file" accept=".csv,.kml,.json,.geojson,text/csv,application/json,application/vnd.google-earth.kml+xml" class="visually-hidden"><span data-t>Import from file</span></label>
          <button class="import-btn" id="tripFromLink" type="button" aria-expanded="false" aria-controls="tripImportLinkRow"><span data-t>Add from link</span></button>
        </div>
        <div class="link-row" id="tripImportLinkRow" hidden>
          <input id="tripImportLink" type="url" inputmode="url" autocomplete="off" placeholder="https://maps.app.goo.gl/…" aria-label="A shared Google Maps list's link" data-t-attr="aria-label">
          <button class="btn" id="tripImportGo" type="button" data-t>Import</button>
        </div>
        <p class="hint dim" id="tripImportHint"></p>
      </div>
      <div class="field" id="tripOfflineRow" hidden>
        <span data-t>Offline</span>
        <div class="offline-card" id="offlineCard"></div>
        <p class="hint dim" data-t>Maps from OpenFreeMap. Google's map can't be saved: its terms don't allow it.</p>
      </div>
      <div class="field" id="tripFileRow" hidden>
        <span data-t>Backup</span>
        <div><button class="btn" id="tripExport" type="button" data-t>Save this trip as a file</button></div>
      </div>
      <div class="sheet-actions">
        <button class="btn danger" id="tripDelete" type="button" hidden data-t>Delete trip</button>
        <span class="grow"></span>
        <button class="btn primary" type="submit" id="tripSave" data-t>Create trip</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="mapStyleSheet" aria-labelledby="mapStyleTitle">
    <div class="sheet-body">
      <h2 id="mapStyleTitle" data-t>Map style</h2>
      <div id="mapStyles"></div>
      <div class="sheet-actions">
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Close</button>
      </div>
    </div>
  </dialog>
  <div class="select-bar" id="selectBar" hidden>
    <button class="icon-btn" id="selectDone" type="button" aria-label="Done" data-t-attr="aria-label"></button>
    <span class="select-count" id="selectCount"></span>
    <button class="btn" id="selectMove" type="button" data-t>Move</button>
    <button class="btn danger" id="selectDelete" type="button" data-t>Delete</button>
  </div>
  <dialog class="sheet" id="moveSheet" aria-labelledby="moveTitle">
    <div class="sheet-body">
      <h2 id="moveTitle"></h2>
      <div class="move-list" id="moveList"></div>
      <div class="sheet-actions">
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Cancel</button>
      </div>
    </div>
  </dialog>
  <dialog class="sheet confirm" id="confirmSheet" aria-labelledby="confirmTitle">
    <div class="sheet-body">
      <h2 id="confirmTitle"></h2>
      <p class="dim" id="confirmText"></p>
      <div class="sheet-actions">
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Cancel</button>
        <button class="btn destroy" type="button" id="confirmGo" data-t>Delete</button>
      </div>
    </div>
  </dialog>

  <input id="fileAdd" type="file" multiple class="visually-hidden" tabindex="-1" aria-hidden="true">
  <dialog class="sheet" id="addFilesSheet" aria-labelledby="addFilesTitle">
    <div class="sheet-body">
      <h2 id="addFilesTitle"></h2>
      <p class="hint dim" id="addFilesNames"></p>
      <button class="choice" id="addFilesSync" type="button">
        <span class="choice-title" data-t>Sync</span>
        <span class="choice-text" data-t>On all your devices, and with everyone the trip is shared with.</span>
      </button>
      <button class="choice" id="addFilesLocal" type="button">
        <span class="choice-title" data-t>Only this device</span>
        <span class="choice-text" data-t>Stays here. Other devices and other people don't see it.</span>
      </button>
      <div class="sheet-actions">
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="fileSheet" aria-labelledby="fileSheetTitle">
    <form class="sheet-body" id="fileForm" novalidate>
      <h2 id="fileSheetTitle" data-t>File</h2>
      <p class="hint dim" id="fileInfo"></p>
      <div class="loc-actions">
        <button class="btn" id="fileOpen" type="button" data-t>Open</button>
        <button class="btn quiet" id="fileSaveCopy" type="button" data-t>Save a copy</button>
      </div>
      <label class="field"><span data-t>Name</span>
        <input name="name" type="text" autocomplete="off" maxlength="200" required>
      </label>
      <fieldset class="field">
        <legend data-t>Kept</legend>
        <div class="seg" id="fileKeptSeg" role="radiogroup"></div>
        <span class="hint" id="fileKeptHint"></span>
      </fieldset>
      <label class="field"><span data-t>Place</span>  <select name="place" id="filePlace"></select></label>
      <label class="field"><span data-t>Note</span>
        <textarea name="note" rows="2" maxlength="2000" placeholder="Booking number 4417" data-t-attr="placeholder"></textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn danger" id="fileDelete" type="button" data-t>Delete</button>
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Cancel</button>
        <button class="btn primary" type="submit" data-t>Save</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="expenseSheet" aria-labelledby="expenseSheetTitle">
    <form class="sheet-body" id="expenseForm" novalidate>
      <h2 id="expenseSheetTitle" data-t>Add an expense</h2>
      <div class="row">
        <label class="field"><span data-t>Amount</span>  <input name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" required></label>
        <label class="field"><span data-t>Currency</span>  <select name="currency" id="expenseCurrency"></select></label>
      </div>
      <label class="field"><span data-t>What</span>
        <input name="title" type="text" autocomplete="off" maxlength="160" placeholder="Ryokan, two nights" data-t-attr="placeholder">
      </label>
      <label class="field"><span data-t>Category</span>  <select name="category" id="expenseCategory"></select></label>
      <label class="field"><span data-t>Day</span>  <select id="expenseDay"></select><input id="expenseDayInput" type="date" hidden></label>
      <label class="field"><span data-t>Place</span>  <select name="place" id="expensePlace"></select></label>
      <label class="field" id="expensePaidRow" hidden><span data-t>Paid by</span>  <select id="expensePaidBy"></select></label>
      <label class="field"><span data-t>Note</span>
        <textarea name="note" rows="2" maxlength="2000"></textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn danger" id="expenseDelete" type="button" hidden data-t>Delete</button>
        <span class="grow"></span>
        <button class="btn quiet" type="button" data-close data-t>Cancel</button>
        <button class="btn primary" type="submit" id="expenseSave" data-t>Add expense</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet page" id="placeSheet" aria-labelledby="placeSheetTitle">
    <form class="sheet-body" id="placeForm" novalidate>
      <div class="page-bar">
        <button class="icon-btn page-back" type="button" data-close aria-label="Back" data-t-attr="aria-label"></button>
        <h2 id="placeSheetTitle" data-t>Add a place</h2>
      </div>
      <label class="field"><span data-t>Name</span>
        <input name="name" type="text" autocomplete="off" maxlength="160" placeholder="Fushimi Inari" required>
      </label>
      <div class="field">
        <span data-t>Location</span>
        <p class="where" id="placeWhere"></p>
        <div class="loc-actions">
          <button class="btn" id="placeFind" type="button" data-t>Find by name</button>
          <button class="btn quiet" id="placePin" type="button" data-t>Pin on map</button>
          <button class="btn quiet" id="placeClear" type="button" hidden data-t>Clear</button>
        </div>
        <p class="hint" id="placeFindNote" role="status"></p>
        <ul class="results" id="placeResults"></ul>
        <div id="placeOpenIn"></div>
      </div>
      <fieldset class="field">
        <legend data-t>Importance</legend>
        <div class="seg" id="importanceSeg" role="radiogroup"></div>
      </fieldset>
      <label class="field"><span data-t>Category</span>
        <select name="category" id="categorySelect"></select>
      </label>
      <div class="row">
        <label class="field"><span data-t>Day</span>  <select name="daySelect" id="daySelect"></select><input name="dayInput" id="dayInput" type="date" hidden></label>
        <label class="field" id="untilField"><span data-t>Until</span>  <select name="untilSelect" id="untilSelect"></select><input name="untilInput" id="untilInput" type="date" hidden></label>
      </div>
      <div class="row">
        <label class="field"><span data-t>From</span>  <input name="time" type="time"></label>
        <label class="field"><span data-t>To</span>  <input name="endTime" type="time"></label>
      </div>
      <div class="field" id="placeFilesRow" hidden>
        <span data-t>Files</span>
        <ul class="attached" id="placeFiles"></ul>
        <div><button class="btn quiet" id="placeAttach" type="button" data-t>Attach a file</button></div>
      </div>
      <label class="field"><span data-t>Description</span>
        <textarea name="note" rows="3" maxlength="2000" placeholder="Go early, before the crowds." data-t-attr="placeholder"></textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn danger" id="placeDelete" type="button" hidden data-t>Delete</button>
      </div>
    </form>
  </dialog>

  <script src="src/keel/platform.js?v=0.3.5"></script>
  <script src="src/keel/releases.js?v=0.3.5"></script>
  <script src="src/keel/update.js?v=0.3.5"></script>
  <script src="src/keel/motion.js?v=0.3.5"></script>
  <script src="src/model.js?v=0.3.5"></script>
  <script src="src/store.js?v=0.3.5"></script>
  <script src="src/settings.js?v=0.3.5"></script>
  <script src="src/keel/github.js?v=0.3.5"></script>
  <script src="src/keel/qr.js?v=0.3.5"></script>
  <script src="src/merge.js?v=0.3.5"></script>
  <script src="src/sync.js?v=0.3.5"></script>
  <script src="src/share.js?v=0.3.5"></script>
  <script src="src/keel/drive.js?v=0.3.5"></script>
  <script src="src/drive.js?v=0.3.5"></script>
  <script src="src/places.js?v=0.3.5"></script>
  <script src="src/weather.js?v=0.3.5"></script>
  <script src="src/listimport.js?v=0.3.5"></script>
  <script src="src/offline.js?v=0.3.5"></script>
  <script src="src/map.js?v=0.3.5"></script>
  <script src="src/icons.js?v=0.3.5"></script>
  <script src="src/views.js?v=0.3.5"></script>
  <script src="src/app.js?v=0.3.5"></script>
</body>
</html>
